# docker compose up -d --build     → http://localhost:3000   (the admin is at /admin)
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy
name: aihot

x-app: &app
  build: .
  image: aihot-app
  env_file: .env
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    LOCAL_ROUTER_URL: http://web:3000
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Per-container CPU caps: on a 2-vCPU box with a provider CPU-limit policy, no single service may
    # pin both cores. Aggregate caps via systemd drop-ins: docker.slice CPUQuota=130% (all containers)
    # + docker.service CPUQuota=170% (daemon & builds). Memory caps keep the 3G box out of swap thrash.
    cpus: 0.7
    mem_limit: 600m
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the topics and demo sources, then exits.
  setup:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *app
    command: ["node", "apps/api/src/main.ts"]
    cpus: 0.7
    mem_limit: 448m
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=320
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "apps/worker/src/main.ts"]
    # Heaviest container: sync batches, translations, ranking. Hard-capped so a runaway batch
    # degrades instead of pinning the box (systemd caps docker.service at 170% overall).
    cpus: 1.2
    mem_limit: 384m
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    cpus: 0.5
    mem_limit: 448m
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=320
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
